name: Publicar actualización de Windows

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-windows:
    runs-on: windows-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.18.3

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Comprobar el proyecto
        run: pnpm check

      - name: Compilar la aplicación
        run: pnpm build

      - name: Compilar y publicar instalador
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          pnpm exec electron-builder --win --x64 --publish always
          "-c.publish.provider=github"
          "-c.publish.owner=${{ github.repository_owner }}"
          "-c.publish.repo=${{ github.event.repository.name }}"
