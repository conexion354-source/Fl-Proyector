name: Publicar actualización de Windows

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-windows:
    runs-on: windows-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.18.3

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Comprobar el proyecto
        run: pnpm check

      - name: Compilar la aplicación
        run: pnpm build

      - name: Crear instalador y metadatos de actualización
        shell: pwsh
        run: pnpm exec electron-builder --win --x64 --publish never

      - name: Crear versión en GitHub
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: FL Proyector ${{ github.ref_name }}
          generate_release_notes: true

      - name: Publicar metadatos de actualización
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: true
          files: |
            release/latest.yml
            release/Fl-Proyector-*-Setup.exe.blockmap

      - name: Publicar instalador de Windows
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: true
          files: release/Fl-Proyector-*-Setup.exe
